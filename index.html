<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR Detective Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30205b,#090d20 65%);color:#eeeaff;font:17px/1.55 system-ui,sans-serif;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(30px,5vw,58px);line-height:1.1;margin:18px 0;color:#bba0ff}h2{color:#72f5e4}small,.muted{color:#b9b4d4}.panel{background:#15172e;border:1px solid #6352a0;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 0 24px #8055ff19}.tag{letter-spacing:3px;color:#72f5e4;font-size:12px;font-weight:bold}button,input,select{font:inherit;border-radius:9px;padding:12px;color:inherit}input,select{background:#0b1023;border:1px solid #7564ad;width:100%;margin:6px 0 12px}button{background:#70efdc;color:#10182b;border:0;font-weight:750;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#30274d;color:#eeeaff;border:1px solid #8064c4}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{border:1px solid #524679;background:#10142a;border-radius:12px;padding:15px}.question{padding:15px 0;border-bottom:1px solid #373052}label.option{display:block;padding:9px 12px;margin:5px 0;background:#22233d;border-radius:8px;cursor:pointer}input[type=radio]{width:auto;margin:0 9px 0 0;accent-color:#71efdb}.status{display:flex;gap:20px;flex-wrap:wrap;font-weight:bold;color:#72f5e4}.steps{display:flex;gap:8px;margin:15px 0}.step{flex:1;padding:9px;text-align:center;border:1px solid #4e426e;border-radius:8px;color:#aaa0c9}.active{border-color:#72f5e4;color:#72f5e4}.done{background:#20453f;color:#a4ffe9}.portrait{width:100%;height:140px;background:#211c40;border-radius:8px}.world svg{width:100%;height:125px;filter:grayscale(1);opacity:.45;transition:1s}.world.restored svg{filter:none;opacity:1}.world.restored{border-color:#72f5e4;box-shadow:0 0 18px #72f5e433}.feedback{padding:12px;background:#242b46;border-left:4px solid #72f5e4;margin:15px 0}.code{font: bold 32px monospace;letter-spacing:12px;color:#72f5e4}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px;border-bottom:1px solid #484361}.cert{background:#fff;color:#24203c;border:8px double #9b78ce;padding:45px 20px;text-align:center;margin:20px 0}.cert h1{color:#38246b}.cert h2{color:#38246b}.cert .award{font-size:36px;font-weight:bold}.cert p{overflow-wrap:anywhere}@media print{body{background:white}main{max-width:none;padding:0}body *{visibility:hidden}#certificate,#certificate *{visibility:visible}#certificate{position:absolute;left:0;top:0;width:100%;margin:0;box-shadow:none;min-height:175mm} @page{size:A4 landscape;margin:12mm}}
</style><main><header><div class="tag">VR WORLD / CLASSIFIED • CASE 010</div><div class="status"><span id="clock">20:00</span><span id="score">0 / 20</span></div></header><div id="steps" class="steps"></div><div id="app"></div></main><script>
const $=id=>document.getElementById(id), names=['The VR Equipment Room','The Suspect Files','The Grammar Firewall','The Corrupted Virtual Worlds','The Final Verdict'];
const suspects=[['Emma Wilson','VR Game Designer','I was designing a fantasy kingdom until 6 p.m. I left the office at 6:15. I did not return to the building.','#bd8af9',0],['Alex Morgan','Software Developer','I was testing a new VR application. I finished my work at 6:30. I did not access the main project server after that.','#66e9df',1],['Sophia Lee','VR Experience Tester','I was exploring the virtual ocean between 6:00 and 7:00. My testing session was recorded automatically.','#f5a5c9',2],['Ryan Cooper','Project Manager','I was preparing tomorrow’s presentation. Project Infinity will be demonstrated to international investors tomorrow.','#91aaff',3]];
const Q=[[
['Headset',['A device worn over the eyes to experience VR.','A computer-created imitation of a real situation.','A device that detects movement.','Making users feel completely involved.'],0],['Simulation',['A device that detects movement.','A computer-created imitation of a real situation.','Making users feel completely involved.','A device worn over the eyes.'],1],['Immersive',['A device worn over the eyes.','A computer-created imitation.','Making users feel completely involved.','A device that detects movement.'],2],['Motion sensor',['A computer-created imitation.','Making users feel completely involved.','A device worn over the eyes.','A device that detects movement.'],3]],
[['Who was creating a fantasy environment?',['Emma','Alex','Sophia','Ryan'],0],['Who was testing a new application?',['Ryan','Sophia','Alex','Emma'],2],['Whose testing session was recorded automatically?',['Alex','Sophia','Emma','Ryan'],1],['Who was preparing the presentation for investors?',['Sophia','Emma','Alex','Ryan'],3]],
[['I think virtual reality ___ more popular in the future.',['will become','will becoming','will be become'],0],['This time tomorrow, we ___ a new virtual world.',['will explored','will be exploring','will have explore'],1],['By next Friday, the developers ___ the new VR game.',['will completing','will be completed','will have completed'],2],['The new VR application ___ next month.',['will release','will be released','will releasing'],1],['We have already decided: we ___ test the new headsets this afternoon.',['are going to','will have','will be'],0]],
[['Which world helps students practise professional skills safely?',['World A','World B','World C'],2],['Which world connects literature with technology?',['World A','World B','World C'],1],['Which disadvantage is mentioned in World A?',['High cost','Poor graphics','Health problems'],0],['How can users reduce the health risks mentioned in World B?',['Use VR continuously','Take regular breaks','Ignore discomfort'],1]],
[['Who is the main suspect?',['Emma Wilson','Alex Morgan','Sophia Lee','Ryan Cooper'],1],['Which evidence contradicts the suspect’s statement?',['The equipment was expensive.','The presentation was scheduled for tomorrow.','The suspect’s ID accessed the server after 6:30.','The VR ocean was being tested.'],2],['How should the company prevent similar incidents?',['Delete all virtual worlds.','Stop using technology.','Share one password with all employees.','Introduce stronger authentication and secure backups.'],3]]];
let team='',members='',stage=-1,scores=[null,null,null,null,null],answers=[],deadline=0,timer=null,finished=false,expired=false,restored=false,codeOK=false,history=[];const digits='84629';const total=()=>scores.reduce((a,b)=>a+(b??0),0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){ $('score').textContent=total()+' / 20';$('steps').innerHTML=names.map((n,i)=>`<div class="step ${scores[i]!==null?'done':i===stage?'active':''}" title="${n}">${scores[i]!==null?'✓':i>stage?'🔒': '◉'} ${i+1}</div>`).join('');}
function home(){stage=-1;update();$('app').innerHTML=`<section class="panel"><div class="tag">UNIT REVIEW • GRADE 10 • B1–B2</div><h1>VR DETECTIVE QUEST</h1><h2>The mystery of the lost virtual world</h2><p>Project Infinity, a revolutionary virtual universe, has disappeared just before its official presentation. Four employees had access. Investigate the evidence, unlock the server and restore the virtual worlds.</p><div class="grid"><div class="tile">⏱ 20 minutes</div><div class="tile">🔐 5 missions</div><div class="tile">★ 20 points</div></div><form id="reg"><p><label>Detective agency name<input id="team" required maxlength="80" placeholder="e.g. Neon Detectives"></label><label>Team members (names)<input id="members" required maxlength="300" placeholder="Enter all participants"></label></p><p class="muted">First submissions determine your score. You may correct mistakes to unlock evidence without gaining extra points.</p><p>17–20: 1st Place · 13–16: 2nd Place · 8–12: 3rd Place · 0–7: Participation</p><button>Start investigation</button></form></section>`;$('reg').onsubmit=e=>{e.preventDefault();team=$('team').value.trim();members=$('members').value.trim();if(!team||!members)return;stage=0;deadline=Date.now()+1200000;timer=setInterval(tick,250);tick();render();};}
function tick(){let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s&&!finished){expired=true;finish();}}
function portrait(s){let i=s[3],hair=['M43 66 Q28 10 80 12 Q125 10 117 76 L105 56 L101 35 Q75 55 49 38 Z','M43 46 Q40 12 80 12 Q120 12 116 45 L100 30 L58 35 Z','M40 78 Q25 12 80 12 Q135 12 120 78 L105 48 L55 48 Z','M43 45 Q40 14 80 14 Q115 14 117 45 L90 28 L55 37 Z'][i];return `<svg class="portrait" viewBox="0 0 160 140" role="img" aria-label="Illustrated portrait of ${s[0]}"><rect width="160" height="140" fill="#201b39"/><circle cx="80" cy="66" r="55" fill="none" stroke="${s[2]}" opacity=".4"/><path d="M20 140 Q25 98 80 98 Q135 98 140 140" fill="${s[2]}"/><rect x="69" y="83" width="22" height="25" rx="7" fill="#c58f75"/><ellipse cx="80" cy="59" rx="35" ry="43" fill="${['#e6b49a','#c58f75','#e4b68e','#a97558'][i]}"/><path d="${hair}" fill="${['#553449','#392c35','#25243a','#594032'][i]}"/><circle cx="67" cy="60" r="3"/><circle cx="93" cy="60" r="3"/><path d="M70 80 Q80 85 90 80" fill="none" stroke="#75464b" stroke-width="2"/>${i===1?'<path d="M55 53h23v14H55z M82 53h23v14H82z M78 58h4" fill="none" stroke="#35334b" stroke-width="2"/>':''}</svg>`;}
const worlds=[['Space Explorer','Students can explore planets without leaving their classroom. However, the equipment is expensive.','<circle cx="100" cy="58" r="36" fill="#8765ff"/><ellipse cx="100" cy="58" rx="67" ry="13" fill="none" stroke="#73f5df" stroke-width="6" transform="rotate(-22 100 58)"/><circle cx="30" cy="20" r="3" fill="white"/><circle cx="175" cy="95" r="4" fill="white"/>'],['Fantasy Kingdom','Users can become characters from fantasy books. Long sessions may cause eye strain and headaches.','<path d="M15 110L55 40 95 110M100 110L150 20 190 110" fill="#5448a3"/><path d="M65 110V50H85V65H115V50H135V110Z" fill="#a68aff"/><path d="M60 50L75 28 90 50M110 50L125 28 140 50" fill="#71f0dc"/><rect x="93" y="85" width="15" height="25" fill="#22213d"/>'],['Virtual Hospital','Medical students can practise difficult procedures without putting real patients at risk.','<rect x="35" y="25" width="130" height="85" rx="8" fill="#6155a8"/><path d="M90 40h20v20h20v20h-20v20H90V80H70V60h20z" fill="#75f3df"/>']];
function worldCards(){return `<div class="grid">${worlds.map((w,i)=>`<div class="tile world ${restored?'restored':''}"><svg viewBox="0 0 200 125" role="img" aria-label="${w[0]}"><rect width="200" height="125" rx="8" fill="#141a35"/>${w[2]}</svg><b>WORLD ${'ABC'[i]} — ${w[0]}</b><p>${w[1]}</p><small>${restored?'✓ RESTORED':'⚠ CORRUPTED'}</small></div>`).join('')}</div>`;}
function log(){return `<div class="panel"><div class="tag">RECOVERED SERVER RECORDS</div><table>${[['18:15','Emma Wilson — Building exit'],['18:30','Alex Morgan — Application test completed'],['18:35','Ryan Cooper — Presentation file opened'],['18:42','AM-024 — Main server login'],['18:45','AM-024 — Project Infinity transferred'],['18:50','AM-024 — Main server logout'],['19:00','Sophia Lee — VR testing completed']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><p>Employee IDs: EW-012 — Emma; AM-024 — Alex; SL-036 — Sophia; RC-048 — Ryan.</p></div>`;}
const clues=['The equipment is working correctly. A broken headset or motion sensor did not cause the disappearance.','Project Infinity disappeared at exactly 6:45 p.m. Compare the statements with the server records.','The virtual world was transferred to a private digital folder. It was not permanently deleted.','The virtual environments are restored. Examine the recovered server records.','The account records identify a main suspect, not definitive proof of personal guilt.'];
function render(){if(finished)return;update();let intro=['Match each term with its definition.','Read the four statements and answer the questions.','Choose the correct future forms. Recover the five-digit code.','Read about three virtual worlds and analyse their benefits and risks.','Use the recovered evidence to identify the main suspect.'][stage];$('app').innerHTML=`<section class="panel"><div class="tag">MISSION ${stage+1} / 5 • ${Q[stage].length} POINTS</div><h2>${names[stage]}</h2><p>${intro}</p>${stage===1?'<div class="grid">'+suspects.map(s=>`<div class="tile">${portrait(s)}<b>${s[0]}</b><br><small>${s[1]}</small><p>“${s[2]}”</p></div>`).join('')+'</div>':''}${stage===3?worldCards():''}${stage===4?log():''}<form id="quiz">${Q[stage].map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" required>${a}</label>`).join('')}</div>`).join('')}<button>Submit answers</button></form><div id="feedback" aria-live="polite"></div></section>`;$('quiz').onsubmit=submit;}
function submit(e){e.preventDefault();if(finished)return;let f=new FormData(e.target);answers=Q[stage].map((q,i)=>Number(f.get('q'+i)));let n=Q[stage].filter((q,i)=>q[2]===answers[i]).length;if(scores[stage]===null){scores[stage]=n;history[stage]=answers.slice();}update();let fb=$('feedback');if(stage===2){let code=Q[stage].map((q,i)=>q[2]===answers[i]?digits[i]:'?').join('');fb.innerHTML=`<div class="feedback">First-attempt score: ${scores[stage]}/5. Correct any mistakes to reveal all digits.<div class="code">${code}</div></div><form id="codeform"><label>Enter the five-digit code<input id="code" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required></label><button>Unlock server</button></form><div id="codefeedback"></div>`;$('codeform').onsubmit=ev=>{ev.preventDefault();if(finished)return;if(n===5&&$('code').value===digits){codeOK=true;lockQuiz();showClue();}else $('codefeedback').textContent='Access denied. Correct the grammar answers and check the code.';};return;}if(stage===3){restored=true;document.querySelectorAll('.world').forEach(w=>{w.classList.add('restored');w.querySelector('small').textContent='✓ RESTORED';});}lockQuiz();showClue();}
function lockQuiz(){document.querySelectorAll('#quiz input,#quiz button').forEach(x=>x.disabled=true);}
function showClue(){$('feedback').innerHTML=`<div class="feedback"><b>First-attempt score: ${scores[stage]}/${Q[stage].length}</b><p>${clues[stage]}</p>${Q[stage].map((q,i)=>history[stage][i]!==q[2]?`<small>Q${i+1}: ${q[1][q[2]]}</small><br>`:'').join('')}</div><button id="next">${stage===4?'Finish investigation':'Open next mission →'}</button>`;$('next').onclick=()=>{if(finished)return;if(stage===4)finish();else{stage++;render();window.scrollTo(0,0);}};}
function award(){return total()>=17?'1st Place':total()>=13?'2nd Place':total()>=8?'3rd Place':'Certificate of Participation';}
function finish(){if(finished)return;finished=true;clearInterval(timer);update();let a=award();$('app').innerHTML=`<section class="panel"><div class="tag">INVESTIGATION REPORT</div><h2>${expired?'TIME IS UP':history[4]?.[0]===1?'CASE SOLVED':'INVESTIGATION COMPLETE'}</h2><p>${restored?'Project Infinity’s three environments have been restored.':'The restoration mission was not completed.'} ${expired?'Only submitted answers count.':''}</p><p>Main suspect: Alex Morgan. His account accessed the server after 6:30, but account use alone does not establish guilt.</p><table>${names.map((n,i)=>`<tr><td>${n}</td><td>${scores[i]===null?'Not submitted':scores[i]+' / '+Q[i].length}</td></tr>`).join('')}<tr><th>Total</th><th>${total()} / 20</th></tr></table><div id="certificate" class="cert"><div class="tag" style="color:#67459a">VR WORLD • PROJECT INFINITY</div><h1>${total()>=8?'DIPLOMA':'CERTIFICATE'}</h1><div class="award">${a}</div><p>Presented to the detective agency</p><h2>${esc(team)}</h2><p>${esc(members)}</p><p>For participation in VR Detective Quest<br>Virtual Reality • Unit Review • Grade 10</p><h2>${total()} / 20 points</h2><p>${new Date().toLocaleDateString('en-GB')}</p><p>Teacher signature: ____________________</p></div><button id="print">Print diploma / Save as PDF</button><button id="report">Download team report</button><button class="secondary" id="restart">New investigation</button></section>`;$('print').onclick=()=>window.print();$('report').onclick=download;$('restart').onclick=()=>{if(confirm('Start a new investigation? Current results will be cleared.'))location.reload();};}
function download(){let t=['VR DETECTIVE QUEST — TEAM REPORT','Agency: '+team,'Members: '+members,'Date: '+new Date().toLocaleString(),'Result: '+award(),'Score: '+total()+'/20','Time expired: '+(expired?'Yes':'No'),'Server unlocked: '+(codeOK?'Yes':'No'),'Worlds restored: '+(restored?'Yes':'No'),''];names.forEach((n,i)=>{t.push(n+': '+(scores[i]===null?'Not submitted':scores[i]+'/'+Q[i].length));if(history[i])Q[i].forEach((q,j)=>t.push('  '+(j+1)+'. '+q[0]+' | Answer: '+q[1][history[i][j]]+' | '+(history[i][j]===q[2]?'Correct':'Correct answer: '+q[1][q[2]])));});let url=URL.createObjectURL(new Blob(['\ufeff'+t.join('\n')],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='VR_Detective_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
home();</script></html>
